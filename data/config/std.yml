# Legacy generic paper board — hidden from the config menu.
# Use paper.yml (PAPER). Kept as an include/overlay source.

name: STD
look: std
radarRange: 25
arrivalRange: 100
arrivalEtaMinutes: 30

include:
  - std-rules.yml

layout:
  bays:
    bay1:
      sections:
        pending_dep:
          title: ""
          hideHeader: true
          addFromTop: true
        clearance:
          title: CLEARANCE
          addFromTop: true
        taxi:
          title: TAXI
          addFromTop: false
    bay2:
      sections:
        sequence:
          title: ""
          hideHeader: true
          addFromTop: true
        runway:
          title: RWY <drwy>
          addFromTop: false
    bay3:
      sections:
        pending_arr:
          title: ""
          hideHeader: true
          addFromTop: true
        tma_ctr:
          title: TMA CTR
          addFromTop: true

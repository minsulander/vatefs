# VatEFS single-runway, 3-bay RTC layout (SAAB strip look)
# Same section IDs / rules as multiairport.yml (arr / app / rwy / twy / dep),
# but a fixed 3-column TWR layout instead of per-airport bayTemplate.
# Airports from EuroScope rwyconfig or --airport CLI.

name: 1RWY3BAY
look: saab
radarRange: 25

layout:
  bays:
    # Left: inbound arrivals only
    bay1:
      sections:
        arr:
          title: INBOUND
          addFromTop: true

    # Middle: CTR/TMA top, RUNWAY bottom half (last section flexes)
    bay2:
      sections:
        app:
          title: CTR
          addFromTop: true
        rwy:
          title: RUNWAY
          # Runtime: arr top / dep bottom (see getNewStripPosition)
          addFromTop: false

    # Right: DEP top, TAXIWAY bottom half
    bay3:
      sections:
        dep:
          title: DEP
          addFromTop: false
        twy:
          title: TAXIWAY
          # Runtime: arr top / dep bottom (isTaxiSectionId includes twy)
          addFromTop: true

sectionRules:
  # === RUNWAY (highest priority) ===
  on_runway_geographic:
    sectionId: rwy
    onRunway: true
    priority: 200

  runway_lineup_depa:
    sectionId: rwy
    airborne: false
    groundstates: [LINEUP, DEPA]
    priority: 90

  runway_cleared_to_land:
    sectionId: rwy
    direction: either
    clearedToLand: true
    airborne: true
    groundstates: ['', NSTS, ARR]
    priority: 95

  # === INBOUND / ARR (inbound arrivals still outside CTR) ===
  arr_inbound_not_myself:
    sectionId: arr
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    priority: 70

  arr_assumed:
    sectionId: arr
    direction: arrival
    controller: myself
    airborne: true
    groundstates: ['', NSTS, ARR]
    priority: 80

  arr_low_altitude:
    sectionId: arr
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    maxAltitudeAboveField: 1500
    priority: 75

  arr_fallback:
    sectionId: arr
    direction: arrival
    airborne: true
    priority: 5

  # === CTR (inside CTR arrivals + airborne dep / local / missed) ===
  # Same RTC pull as multiairport: CA/VA/CAT/OS → CTR even outside withinCtr.
  app_arr_approach_clearance:
    sectionId: app
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    approachClearance: true
    priority: 91

  app_arr_within_ctr:
    sectionId: app
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    withinCtr: true
    priority: 90

  app_missed_approach:
    sectionId: app
    missedApproach: true
    controller: myself
    airborne: true
    priority: 105

  app_airborne_dep:
    sectionId: app
    direction: departure
    airborne: true
    priority: 100

  app_airborne_local:
    sectionId: app
    direction: local
    airborne: true
    priority: 100

  # === TWY (only start/push or taxi — CLR alone stays in DEP) ===
  twy_push_start:
    sectionId: twy
    direction: departure
    airborne: false
    groundstates: [STUP, PUSH]
    priority: 60

  twy_push_start_local:
    sectionId: twy
    direction: local
    airborne: false
    groundstates: [STUP, PUSH]
    priority: 60

  twy_taxi_dep:
    sectionId: twy
    direction: departure
    airborne: false
    groundstates: [TAXI]
    priority: 30

  # RTO → TAXI IN: departure with TXIN still lands on TAXIWAY (single bay)
  twy_taxi_dep_txin:
    sectionId: twy
    direction: departure
    airborne: false
    groundstates: [TXIN]
    priority: 32

  twy_taxi_dep_local:
    sectionId: twy
    direction: local
    airborne: false
    groundstates: [TAXI]
    priority: 30

  twy_taxi_arr_local:
    sectionId: twy
    direction: local
    airborne: false
    groundstates: [ARR, TXIN]
    priority: 35

  twy_taxi_arr:
    sectionId: twy
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR, TAXI, TXIN]
    priority: 30

  # === DEP (pending + cleared) ===
  # False-airborne at gate/pre-push — keep in DEP (beats CTR 100).
  dep_gate_false_airborne:
    sectionId: dep
    direction: departure
    airborne: true
    groundstates: [ONFREQ, DE-ICE, STUP, PUSH, PARK]
    priority: 110

  dep_gate_false_airborne_local:
    sectionId: dep
    direction: local
    airborne: true
    groundstates: [ONFREQ, DE-ICE, STUP, PUSH, PARK]
    priority: 110

  dep_parked:
    sectionId: dep
    direction: departure
    groundstates: [PARK]
    priority: 110

  dep_parked_local:
    sectionId: dep
    direction: local
    groundstates: [PARK]
    priority: 110

  dep_pending:
    sectionId: dep
    direction: departure
    airborne: false
    groundstates: ['', NSTS, ONFREQ, PARK]
    clearance: false
    priority: 40

  dep_cleared:
    sectionId: dep
    direction: departure
    airborne: false
    clearance: true
    groundstates: ['', NSTS, ONFREQ, DE-ICE, PARK]
    priority: 50

  dep_pending_local:
    sectionId: dep
    direction: local
    airborne: false
    groundstates: ['', NSTS, ONFREQ, DE-ICE, PARK]
    clearance: false
    priority: 40

  dep_cleared_local:
    sectionId: dep
    direction: local
    airborne: false
    clearance: true
    groundstates: ['', NSTS, ONFREQ, DE-ICE, PARK]
    priority: 50

  dep_fallback_departure:
    sectionId: dep
    direction: departure
    priority: 5

  dep_fallback_local:
    sectionId: dep
    direction: local
    priority: 5

actionRules:
  ready_del:
    action: READY
    direction: either
    controller: myself
    clearance: true
    groundstates: ['', ONFREQ, STUP, NSTS]
    myRole: [DEL]
    notMyRole: [GND]
    priority: 120

  clnc_del:
    action: CLNC
    sectionId: dep
    direction: either
    clearance: false
    myRole: [DEL]
    priority: 115

  assume_dep_del:
    action: ASSUME
    direction: either
    controller: not_myself
    airborne: false
    myRole: [DEL]
    priority: 110

  xfer_gnd_taxi_dep:
    action: XFER
    direction: either
    controller: myself
    groundstates: [TAXI]
    handoffInitiated: false
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  push_deice_gnd:
    action: PUSH
    sectionId: twy
    direction: either
    controller: myself
    groundstates: [DE-ICE]
    myRole: [GND, TWR, APP, CTR]
    priority: 113

  txi_arr_gnd:
    action: TXI
    direction: arrival
    controller: myself
    groundstates: ['', NSTS, ARR]
    airborne: false
    myRole: [GND]
    priority: 112

  txi_local_gnd:
    action: TXI
    direction: local
    controller: myself
    groundstates: [ARR]
    airborne: false
    myRole: [GND]
    priority: 112

  assume_arr_gnd:
    action: ASSUME
    direction: arrival
    controller: not_myself
    airborne: false
    myRole: [GND]
    priority: 111

  # GND: ASSUME RTO → TAXI IN when TWR transferred
  assume_dep_txin_gnd:
    action: ASSUME
    direction: departure
    controller: not_myself
    airborne: false
    groundstates: [TXIN]
    handoffInitiated: true
    myRole: [GND]
    priority: 111

  xfer_twr_to_gnd:
    action: XFER
    direction: either
    controller: myself
    groundstates: ['', NSTS, ARR, TXIN]
    airborne: false
    handoffInitiated: false
    myRole: [TWR, APP, CTR]
    notMyRole: [GND]
    nextControllerRole: [GND]
    priority: 110

  # ROF for pending INBOUND / CTR arrivals owned by another position
  rof_arr:
    action: ROF
    sectionId: arr
    direction: either
    controller: not_myself
    handoffInitiated: false
    priority: 120

  rof_arr_ctr:
    action: ROF
    sectionId: app
    direction: either
    controller: not_myself
    handoffInitiated: false
    priority: 120

  assume_arr:
    action: ASSUME
    sectionId: arr
    direction: either
    controller: not_myself
    handoffInitiated: true
    priority: 100

  assume_arr_ctr:
    action: ASSUME
    sectionId: app
    direction: either
    controller: not_myself
    handoffInitiated: true
    priority: 100

  ctl_arr:
    action: CTL
    sectionId: arr
    direction: either
    controller: myself
    clearedToLand: false
    myRole: [TWR]
    priority: 90

  ctl_arr_ctr:
    action: CTL
    sectionId: app
    direction: arrival
    controller: myself
    clearedToLand: false
    myRole: [TWR]
    priority: 90

  goa_rwy:
    action: GOA
    sectionId: rwy
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  goa_ctr_arr:
    action: GOA
    sectionId: app
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  cto_lineup:
    action: CTO
    direction: either
    controller: myself
    groundstates: [LINEUP]
    airborne: false
    myRole: [TWR]
    priority: 90

  # Rejected takeoff after CFTO — UI expands to TAXI OUT / TAXI IN
  rto_depa:
    action: RTO
    direction: departure
    controller: myself
    groundstates: [DEPA]
    airborne: false
    myRole: [TWR]
    priority: 95

  lu_taxi_dep:
    action: LU
    direction: departure
    controller: myself
    groundstates: [TAXI]
    airborne: false
    myRole: [TWR]
    priority: 85

  lu_taxi_local:
    action: LU
    direction: local
    controller: myself
    groundstates: [TAXI]
    airborne: false
    myRole: [TWR]
    priority: 85

  xfer_missed_approach:
    action: XFER
    missedApproach: true
    controller: myself
    handoffInitiated: false
    myRole: [TWR]
    notMyRole: [APP, CTR]
    priority: 102

  xfer_app_dep:
    action: XFER
    sectionId: app
    direction: departure
    controller: myself
    airborne: true
    handoffInitiated: false
    myRole: [TWR]
    priority: 95

  park_arr:
    action: PARK
    direction: either
    controller: myself
    groundstates: [TXIN]
    onRunway: false
    myRole: [GND]
    priority: 77

  txo_push:
    action: TXO
    sectionId: twy
    direction: either
    controller: myself
    groundstates: [PUSH, STUP]
    myRole: [GND]
    priority: 75

  clnc_dep:
    action: CLNC
    sectionId: dep
    direction: either
    clearance: false
    myRole: [DEL]
    priority: 65

  push_dep_cleared:
    action: PUSH
    sectionId: dep
    direction: either
    controller: myself
    clearance: true
    groundstates: ['', ONFREQ, STUP, NSTS]
    myRole: [GND]
    priority: 70

  assume_departure_ground:
    action: ASSUME
    direction: either
    controller: not_myself
    airborne: false
    myRole: [DEL]
    priority: 10

  assume_arrival:
    action: ASSUME
    direction: arrival
    controller: not_myself
    myRole: [GND]
    priority: 10

deleteRules:
  delete_dep_high_transferred:
    direction: departure
    controller: not_myself
    minAltitudeAboveField: 2500
    priority: 100

  delete_parked:
    direction: arrival
    groundstates: [PARK]
    priority: 100

  delete_parked_local:
    direction: local
    groundstates: [PARK]
    priority: 100

  delete_beyond_range:
    beyondRange: true
    priority: 10

moveRules:
  # INBOUND/CTR <-> RWY (CTL)
  move_arr_to_rwy_ctl:
    fromSectionId: arr
    toSectionId: rwy
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  move_ctr_arr_to_rwy_ctl:
    fromSectionId: app
    toSectionId: rwy
    direction: arrival
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  move_rwy_to_arr_clear_ctl:
    fromSectionId: rwy
    toSectionId: arr
    command:
      type: setClearedToLand
      value: false

  move_rwy_to_ctr_clear_ctl:
    fromSectionId: rwy
    toSectionId: app
    direction: arrival
    command:
      type: setClearedToLand
      value: false

  # CTR (dep airborne)
  move_to_app_set_depa:
    toSectionId: app
    command:
      type: setGroundstate
      value: DEPA

  # TWY <-> RWY
  move_twy_to_rwy:
    fromSectionId: twy
    toSectionId: rwy
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setGroundstate
      value: LINEUP

  move_rwy_to_twy_dep:
    fromSectionId: rwy
    toSectionId: twy
    direction: departure
    priority: 10
    command:
      type: setGroundstate
      value: TAXI

  move_rwy_to_twy_arr:
    fromSectionId: rwy
    toSectionId: twy
    direction: either
    myRole: [GND, TWR, APP, CTR]
    command:
      type: setGroundstate
      value: TXIN

  # DEP <-> TWY
  move_dep_to_twy_push:
    fromSectionId: dep
    toSectionId: twy
    direction: either
    myRole: [GND]
    command:
      type: setGroundstate
      value: PUSH

  move_twy_to_dep:
    fromSectionId: twy
    toSectionId: dep
    direction: either
    command:
      type: setGroundstate
      value: ONFREQ

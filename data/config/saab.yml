# VatEFS OTHER — flexible classic layout (digital SAAB strip look).
# Profiles (Layout menu): 1RWY 3/4 BAYS, 2RWY 4 BAYS.
# Shared rules: common-rules.yml + saab-rules.yml (filtered to the active profile).
# Airports from EuroScope rwyconfig or --airport CLI.
# File stays saab.yml; "SAAB" here means strip chrome (look), not the config name.

name: OTHER
look: saab
layoutMode: saabLayouts
radarRange: 25
arrivalRange: 100
arrivalEtaMinutes: 20
defaultLayout: 1rwy4

include:
  - common-rules.yml
  - saab-rules.yml

layouts:
  # 1RWY · 3 BAYS — L→R: DEP+TAXIWAY | CTR+RUNWAY | INBOUND+TMA
  # Departures from top-left; arrivals from top-right. Sort-flow: newestTop.
  1rwy3:
    name: 1RWY
    layout:
      bays:
        bay1:
          sections:
            pending_dep:
              title: DEP
              addFromTop: true
            cleared:
              title: DEP
              addFromTop: true
            taxi:
              title: TAXIWAY
              addFromTop: true
        bay2:
          sections:
            # Workspace collapses ctr_arr + ctr_dep titled CTR → one CTR header
            ctr_arr:
              title: CTR
              addFromTop: true
            ctr_dep:
              title: CTR
              addFromTop: true
            runway:
              title: RUNWAY
              addFromTop: true
        bay3:
          sections:
            inbound:
              title: INBOUND
              addFromTop: true
            tma:
              title: TMA
              addFromTop: true
            # Orphan/spawn fallback — workspace injects visible header
            system_inbound:
              title: SYSTEM INBOUND

  # 1RWY · 4 BAYS — L→R: PENDING+CLEARED | PUSH+TAXI | RUNWAY+CTR DEP | INBOUND+CTR ARR
  1rwy4:
    name: 1RWY
    layout:
      bays:
        bay1:
          sections:
            pending_dep:
              title: PENDING CLR
              addFromTop: true
            cleared:
              title: CLEARED
              addFromTop: true
        bay2:
          sections:
            push_start:
              title: PUSH&START
              addFromTop: true
            taxi:
              title: TAXIWAY
              addFromTop: true
        bay3:
          sections:
            runway:
              title: RUNWAY
              addFromTop: true
            ctr_dep:
              title: CTR DEP
              addFromTop: true
        bay4:
          sections:
            inbound:
              title: INBOUND
              addFromTop: true
            ctr_arr:
              title: CTR ARR
              addFromTop: true
            # Declared for sectionRules / catalog (TMA-only coverage default).
            ctr_inbound:
              title: CTR INBOUND
            # Orphan/spawn fallback — workspace injects visible header
            system_inbound:
              title: SYSTEM INBOUND

  # 2RWY · 4 BAYS — L→R: PENDING+CLEARED | PUSH+TAXI | RUNWAY DEP+CTR DEP | INBOUND+CTR ARR+RWY ARR
  2rwy4:
    name: 2RWY
    layout:
      bays:
        bay1:
          sections:
            pending_dep:
              title: PENDING CLR
              addFromTop: true
            cleared:
              title: CLEARED
              addFromTop: true
        bay2:
          sections:
            push_start:
              title: PUSH&START
              addFromTop: true
            taxi:
              title: TAXIWAY
              addFromTop: true
        bay3:
          sections:
            dep_runway:
              title: RUNWAY DEP
              addFromTop: true
            ctr_dep:
              title: CTR DEP
              addFromTop: true
        bay4:
          sections:
            inbound:
              title: INBOUND
              addFromTop: true
            ctr_arr:
              title: CTR ARR
              addFromTop: true
            arr_runway:
              title: RUNWAY ARR
              addFromTop: true
            # Orphan/spawn fallback — workspace injects visible header
            system_inbound:
              title: SYSTEM INBOUND

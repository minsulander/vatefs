# VatEFS OTHER — flexible classic layout (digital SAAB strip look).
# Profiles (Layout menu): 1RWY 3/4 BAYS, 2RWY 4 BAYS.
# Shared rules: common-rules.yml + saab-rules.yml (filtered to the active profile).
# Airports from EuroScope rwyconfig or --airport CLI.
# File stays saab.yml; "SAAB" here means strip chrome (look), not the config name.

name: OTHER
look: saab
layoutMode: saabLayouts
radarRange: 25
arrivalRange: 100
arrivalEtaMinutes: 20
defaultLayout: 1rwy4

include:
  - common-rules.yml
  - saab-rules.yml

layouts:
  # 1RWY · 3 BAYS — L→R: TMA | CTR + RUNWAY | TAXIWAY + DEP
  1rwy3:
    name: 1RWY
    layout:
      bays:
        bay1:
          sections:
            tma:
              title: TMA
        bay2:
          sections:
            # Workspace collapses ctr_arr + ctr_dep titled CTR → one CTR header
            ctr_arr:
              title: CTR
            ctr_dep:
              title: CTR
            runway:
              title: RUNWAY
              addFromTop: false
        bay3:
          sections:
            taxi:
              title: TAXIWAY
              addFromTop: false
            pending_dep:
              title: DEP
            cleared:
              title: DEP

  # 1RWY · 4 BAYS — L→R: INBOUND+CTR ARR | CTR DEP+RUNWAY | TAXI+PUSH | CLEARED+PENDING
  1rwy4:
    name: 1RWY
    layout:
      bays:
        bay1:
          sections:
            inbound:
              title: INBOUND
              # First at bottom (newest on top)
              addFromTop: true
            ctr_arr:
              title: CTR ARR
              addFromTop: true
            # Declared for sectionRules / catalog (TMA-only coverage default).
            # Not shown in the CTR-only builtin column plan until added.
            ctr_inbound:
              title: CTR INBOUND
        bay2:
          sections:
            ctr_dep:
              title: CTR DEP
              addFromTop: false
            runway:
              title: RUNWAY
              addFromTop: false
        bay3:
          sections:
            taxi:
              title: TAXIWAY
              addFromTop: false
            push_start:
              title: PUSH&START
              # First on top (newest at bottom)
              addFromTop: false
        bay4:
          sections:
            cleared:
              title: CLEARED
            pending_dep:
              title: PENDING CLR

  # 2RWY · 4 BAYS — L→R: INBOUND+CTR ARR+RWY ARR | CTR DEP+RWY DEP | TAXI+PUSH | CLEARED+PENDING
  2rwy4:
    name: 2RWY
    layout:
      bays:
        bay1:
          sections:
            inbound:
              title: INBOUND
              # First at bottom (newest on top)
              addFromTop: true
            ctr_arr:
              title: CTR ARR
              addFromTop: true
            arr_runway:
              title: RUNWAY ARR
              # ARR RWY: first at bottom
              addFromTop: true
        bay2:
          sections:
            ctr_dep:
              title: CTR DEP
              addFromTop: false
            dep_runway:
              title: RUNWAY DEP
              addFromTop: false
        bay3:
          sections:
            taxi:
              title: TAXIWAY
              addFromTop: false
            push_start:
              title: PUSH&START
              # First on top (newest at bottom)
              addFromTop: false
        bay4:
          sections:
            cleared:
              title: CLEARED
            pending_dep:
              title: PENDING CLR

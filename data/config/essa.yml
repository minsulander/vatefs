# VatEFS ESSA role-based layout.
# Sections appear/hide based on selected ESSA positions (CD, GND-E/N/W, TWR-E/S/W).
# Same dual-runway routing rules as dualrwy4bays.yml; titles follow SAAB EFS naming.
# RUNWAY headers are physical strips (RUNWAY 01L/19R, RUNWAY 01R/19L, RUNWAY 08/26) —
# no ARR/DEP text. One header per strip in use: active ES RWY config, plus any
# strip whose forced/selected ARR/DEP runway is on a physical pair not already
# covered by that config (e.g. DEP 08 while config is 01L). Same-pair traffic
# (01L while config is 01L) does not open another bay.
# ARR-only strips sit in bay1 between CTR ARR and TAXI ARR. Active RWY config owns
# column preference (FPL assignments do not flip it).

name: ESSA
layoutMode: essaRoles
radarRange: 25  # nm

include:
  - common-rules.yml

layout:
  bays:
    # Left → right: arrivals L→R, departure stages R←L (CD/TSAT on the right).
    # Max 4 columns: if CD+GND+TWR would show 5, CD stacks above TSAT in one bay.
    bay1:
      sections:
        inbound_acc:
          # APP / top-down covering approach: unassumed ACC-owned arrivals at ETN ≤ 15.
          # Hidden from TWR-only boards. Sorted by sector-entry minutes.
          # First at bottom (newest inserts on top).
          title: INBOUND ACC
          addFromTop: true
          visibleFor: [APP]
        inbound:
          # Placeholder title only — runtime always resolves to INBOUND APP (TWR)
          # or INBOUND TWR-E, TWR-W (GND-only). Never shown as bare "INBOUND".
          # Hidden when APP family is also selected (inbound-from-yourself).
          # TWR: ETN≤15 gate + ETN sort. GND: tower-bound rules, appearance order.
          # INBOUND APP: first at bottom (newest on top).
          title: INBOUND
          addFromTop: true
          visibleFor: [GND, TWR]
        ctr_arr:
          # Same strip home for CTR ARR (TWR) and TMA ARR (APP / CD+GND+TWR+APP default).
          # filterEssaLayout retitles to TMA ARR when APP family is selected.
          # First at bottom (newest inserts on top).
          title: CTR ARR
          addFromTop: true
          visibleFor: [TWR, APP]
        arr_runway:
          # Placeholder — replaced at runtime with RUNWAY 01L/19R style pair headers
          title: RUNWAY
          # ARR RWY: first at bottom (newest inserts on top)
          addFromTop: true
          visibleFor: [TWR]
        taxi_arr:
          title: TAXIWAY ARR
          # First at bottom (newest inserts on top).
          addFromTop: true
          # GND boards (and solo TWR covering GND). Hidden on TWR-only when a
          # separate GND is online — TWR keeps TAXIWAY DEP only (not merged).
          visibleFor: [GND, TWR]

    bay2:
      sections:
        ctr_dep:
          # Same strip home for CTR DEP (TWR) and TMA DEP (APP / CD+GND+TWR+APP default).
          # filterEssaLayout retitles to TMA DEP when APP family is selected.
          # Shown on TWR boards by default (including split TWR + separate GND).
          title: CTR DEP
          addFromTop: false
          visibleFor: [TWR, APP]
        dep_runway:
          # Placeholder — replaced at runtime with RUNWAY 01L/19R style pair headers
          title: RUNWAY
          addFromTop: false
          visibleFor: [TWR]

    bay3:
      sections:
        taxi_dep:
          title: TAXIWAY DEP
          # First in the taxi sequence stays on top. The last one cleared
          # (newest taxi-out) is appended at the bottom.
          addFromTop: false
          visibleFor: [GND, TWR]
        # TWR-only: other-owned taxi-out (mirror INBOUND APP).
        # Header resolves to INBOUND GND-E, GND-N, GND-W.
        # Hidden when GND is also selected. Assumed / inbound-transfer → TAXI DEP.
        # Below TAXI DEP on TWR-only boards.
        inbound_gnd:
          title: INBOUND GND
          visibleFor: [TWR]
        push_start:
          title: PUSH BACK / START-UP
          # First on top (newest inserts at bottom).
          addFromTop: false
          visibleFor: [GND]
        # Declared for sectionRules / strip assignment. Workspace built-in
        # defaults omit this header — add via catalog when needed.
        req_push:
          title: REQ PUSH / START
          addFromTop: true
          visibleFor: [CD, GND]

    bay4:
      sections:
        pending_dep:
          # CD (uncleared) — TOBT order: earliest on top (first on top sort-flow).
          # Title becomes "CD ALL" only when merged with TSAT / EOBT.
          title: CD
          addFromTop: false
          visibleFor: [CD]

    bay5:
      sections:
        cleared:
          # Cleared deps waiting for push/startup (CD and GND).
          # Split → TSAT / EOBT only. Earliest on top (first on top sort-flow).
          title: TSAT / EOBT
          addFromTop: false
          visibleFor: [CD, GND]

sectionRules:
  # VCH pending pushback / startup request (annotation 2)
  req_push_start:
    sectionId: req_push
    direction: either
    airborne: false
    vchRequests: [P, S]
    priority: 88

  # Override common-rules taxi → split taxi_dep / taxi_arr
  taxi_dep:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI]
    priority: 30

  taxi_dep_local:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    priority: 30

  # RTO / rejected takeoff → TAXI IN: departure with TXIN goes to TAXIWAY ARR (gate)
  taxi_arr_dep_txin:
    sectionId: taxi_arr
    direction: departure
    airborne: false
    groundstates: [TXIN]
    priority: 92

  # ESSA: CA/VA/CAT/OS → CTR ARR (skips TMA). Outer bay is unassumed-only;
  # approach clearance moves even outside the zone. ESGG keeps CA on INBOUND.
  # GND-only: leave CA on INBOUND (ctr_arr is TWR-visible); TWR/APP/CTR only.
  ctr_arr_approach_clearance_other:
    sectionId: ctr_arr
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    approachClearance: true
    myRole: [TWR, APP, CTR]
    priority: 85

  # Disable common-rules within-CTR / pending-handoff pulls — unassumed stay on
  # INBOUND / INBOUND ACC until assume or approach clearance.
  ctr_arr_within_ctr:
    sectionId: ctr_arr
    myRole: []
    priority: 76

  ctr_arr_within_ctr_no_app:
    sectionId: ctr_arr
    myRole: []
    priority: 101

  ctr_arr_pending_inbound_transfer:
    sectionId: ctr_arr
    myRole: []
    priority: 95

  # INBOUND APP (TWR): ETN ≤ 15 instead of airport ETA (ESGG keeps ETA).
  inbound_arr_groundstate:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    myRole: [TWR, APP, CTR]
    maxSectorEntryMinutes: 15
    priority: 70

  fallback_arrival:
    sectionId: inbound
    direction: arrival
    airborne: true
    myRole: [TWR, APP, CTR]
    maxSectorEntryMinutes: 15
    priority: 5

  # INBOUND ACC: unassumed ACC-owned arrivals at ETN ≤ 15
  inbound_acc_arr:
    sectionId: inbound_acc
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    ownerRole: [CTR]
    maxSectorEntryMinutes: 15
    priority: 72

  # TWR + separate GND: pending inbound handoff → TAXI DEP (like CTR ARR pending transfer)
  taxi_dep_pending_inbound_transfer:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI, TXIN]
    controller: not_myself
    handoffToMyself: true
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 95

  taxi_dep_pending_inbound_transfer_local:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: not_myself
    handoffToMyself: true
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 95

  # TWR: assumed taxi-out → TAXI DEP (not yet on RWY)
  taxi_dep_assumed_twr:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI]
    controller: myself
    myRole: [TWR]
    priority: 90

  taxi_dep_assumed_local_twr:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: myself
    myRole: [TWR]
    priority: 90

  # TWR-only: other-owned taxi-out → INBOUND GND-E/N/W (mirror INBOUND APP)
  inbound_gnd_taxi_dep:
    sectionId: inbound_gnd
    direction: departure
    airborne: false
    groundstates: [TAXI, TXIN]
    controller: not_myself
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 70

  inbound_gnd_taxi_local:
    sectionId: inbound_gnd
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: not_myself
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 70

  # TAXIWAY ARR fallback after TAXI IN (TXIN) — not on mere vacate / ARR.
  taxi_arr_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    groundstates: [TXIN]
    priority: 35

  taxi_arr:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    groundstates: [TXIN]
    priority: 30

  # EoR / DEP RWY: only after TXIN (no auto hop on vacate alone)
  taxi_arr_vacated_dep_rwy:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    onRunway: false
    groundstates: [TXIN]
    depRunway: true
    priority: 108

  taxi_arr_vacated_dep_rwy_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    onRunway: false
    groundstates: [TXIN]
    depRunway: true
    priority: 108

  # === ARR → TAXIWAY ARR (no geographic RWY hold; GS / CTL / LINEUP place on RWY) ===
  # Board matrix:
  # - TWR-only + separate GND: stay on RUNWAY until TXIN or GND assumes (XFER alone does not leave RWY).
  #   TXIN → hidden taxi_arr; GND assume → soft-delete. Board has CTR ARR+DEP + TAXIWAY DEP (not taxi_arr).
  # - GND-only: pending XFER / assumed → taxi_arr (even on RWY)
  # - Combined GND+TWR: TXIN → taxi_arr; ARR without TXIN stays RWY (until-taxi, even after vacate)
  # Only RWY auto-move: dep airborne → CTR DEP when that section is on the board; else DEP RWY until APP assumes.
  # TWR-only + separate GND: TXIN leaves RUNWAY (hidden taxi_arr) — not on XFER alone.
  taxi_arr_txin_twr_separate:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    groundstates: [TXIN]
    controller: myself
    myRole: [TWR]
    notMyRole: [GND]
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    priority: 210

  taxi_arr_txin_twr_separate_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    groundstates: [TXIN]
    controller: myself
    myRole: [TWR]
    notMyRole: [GND]
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    priority: 210

  # GND separate: INBOUND TWR → TAXIWAY ARR when incoming TWR→GND transfer
  taxi_arr_pending_inbound_transfer:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR, TXIN]
    controller: not_myself
    handoffToMyself: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  taxi_arr_pending_inbound_transfer_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    groundstates: ['', NSTS, ARR, TXIN]
    controller: not_myself
    handoffToMyself: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  # GND separate: after ASSUME, stay on TAXIWAY ARR (even ARR / still on RWY).
  # Do not require clearedToLand:false — CTL often lingers a few seconds after
  # assume; that used to fall through to runway_* (shown as INBOUND TWR on GND)
  # then bounce back when CTL cleared.
  taxi_arr_assumed_gnd_separate:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR, TXIN]
    controller: myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  taxi_arr_assumed_local_gnd_separate:
    sectionId: taxi_arr
    direction: local
    airborne: false
    groundstates: ['', NSTS, ARR, TXIN]
    controller: myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  # GND (incl. combined GND+TWR): TAXI (TXI) → TAXIWAY ARR even if still on RWY
  # clearedToLand: false — keep CTL traffic on runway even if airborne flickers false on short final
  taxi_arr_assumed_gnd:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    clearedToLand: false
    groundstates: [TXIN]
    controller: myself
    myRole: [GND]
    priority: 210

  # Assumed local → TAXIWAY ARR on TXIN (TAXI press / combined)
  taxi_arr_assumed_local_gnd:
    sectionId: taxi_arr
    direction: local
    airborne: false
    clearedToLand: false
    groundstates: [TXIN]
    controller: myself
    myRole: [GND]
    priority: 210

  # Combined GND+TWR: assumed / vacated but not yet TXIN — stay off TAXIWAY ARR until TAXI
  # (separate GND uses taxi_arr_assumed_*_separate above instead)
  inbound_assumed_vacated_arr_gnd:
    sectionId: inbound
    direction: arrival
    airborne: false
    onRunway: false
    clearedToLand: false
    groundstates: ['', NSTS, ARR]
    controller: myself
    myRole: [GND]
    essaFamilies: [TWR]
    priority: 104

  inbound_assumed_vacated_local_gnd:
    sectionId: inbound
    direction: local
    airborne: false
    onRunway: false
    clearedToLand: false
    groundstates: [ARR]
    controller: myself
    myRole: [GND]
    essaFamilies: [TWR]
    priority: 104

  # GND (not covering TWR): only tower-bound traffic under INBOUND TWR —
  # same moments TWR would see CTR ARR / ARR RWY (APP→TWR transfer, CTR, runway).
  # Far-out APP arrivals stay out of INBOUND TWR until then.
  inbound_pending_twr_transfer_gnd:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    handoffToRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  inbound_pending_twr_transfer_local_gnd:
    sectionId: inbound
    direction: local
    airborne: true
    groundstates: ['', NSTS, ARR]
    handoffToRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  # Inside CTR → TWR would use ctr_arr_within_ctr; GND keeps it in INBOUND TWR
  inbound_within_ctr_arr_gnd:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    withinCtr: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 112

  inbound_within_ctr_local_gnd:
    sectionId: inbound
    direction: local
    airborne: true
    groundstates: ['', NSTS, ARR]
    withinCtr: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 112

  inbound_on_runway_arr_gnd:
    sectionId: inbound
    direction: arrival
    onRunway: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  inbound_on_runway_local_gnd:
    sectionId: inbound
    direction: local
    onRunway: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  # GND (not covering TWR): keep other-owned vacated arrivals in INBOUND until GND assumes
  inbound_vacated_arr_gnd:
    sectionId: inbound
    direction: arrival
    airborne: false
    onRunway: false
    controller: not_myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 100

  inbound_vacated_local_gnd:
    sectionId: inbound
    direction: local
    airborne: false
    onRunway: false
    controller: not_myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 100

  # === RUNWAY SECTION RULES (no geographic hold) ===
  # ARR stays on RWY by groundstate until TXIN / XFER (same idea as OTHER/RTC).
  # Dep airborne → CTR DEP via common-rules when ctr_dep is on the board; otherwise
  # dep_runway_airborne_hold* keep the strip on DEP RWY until APP assumes.

  # Priority > inbound_assumed_vacated_* (104): ARR stays on RWY until TXIN / XFER
  # (vacate alone must not auto-move). Only RWY auto-move is dep airborne → CTR DEP.
  runway_arr_until_taxi_arr:
    sectionId: arr_runway
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR]
    depRunway: false
    priority: 110

  runway_arr_until_taxi_dep:
    sectionId: dep_runway
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR]
    depRunway: true
    priority: 111

  runway_local_until_taxi_arr:
    sectionId: arr_runway
    direction: local
    airborne: false
    groundstates: [ARR]
    depRunway: false
    priority: 110

  runway_local_until_taxi_dep:
    sectionId: dep_runway
    direction: local
    airborne: false
    groundstates: [ARR]
    depRunway: true
    priority: 111

  # When CTR DEP is hidden / missing, airborne deps stay on DEP RWY (rules-engine skips ctr_dep).
  dep_runway_airborne_hold:
    sectionId: dep_runway
    direction: departure
    airborne: true
    essaFamilies: [TWR]
    priority: 99

  dep_runway_airborne_hold_local:
    sectionId: dep_runway
    direction: local
    airborne: true
    essaFamilies: [TWR]
    priority: 99

  # TWR boards only — GND has no RWY columns; LINEUP/DEPA deps soft-delete there
  # (delete_dep_twr_assumed_*). Without this gate, GND briefly assigns invisible runway_*
  # then used to bounce back via taxi_dep_on_runway_*_gnd.
  runway_lineup_depa_dep:
    sectionId: dep_runway
    airborne: false
    groundstates: [LINEUP, DEPA]
    depRunway: true
    essaFamilies: [TWR]
    priority: 91

  runway_lineup_depa_arr:
    sectionId: arr_runway
    airborne: false
    groundstates: [LINEUP, DEPA]
    depRunway: false
    essaFamilies: [TWR]
    priority: 90

  runway_cleared_to_land_dep:
    sectionId: dep_runway
    direction: either
    clearedToLand: true
    airborne: true
    groundstates: ['', NSTS, ARR]
    depRunway: true
    priority: 96

  runway_cleared_to_land_arr:
    sectionId: arr_runway
    direction: either
    clearedToLand: true
    airborne: true
    groundstates: ['', NSTS, ARR]
    priority: 95

actionRules:
  # CD ALL: CLNC / ACK CLR for uncleared deps (CD family selected)
  clnc_cd_pending:
    action: CLNC
    sectionId: pending_dep
    direction: either
    clearance: false
    essaFamilies: [CD]
    priority: 120

  # GOA while CTL — runway or CTR ARR. Do not use notMyRole:[GND] (hides GOA for solo TWR).
  goa_arr_runway:
    action: GOA
    sectionId: arr_runway
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  goa_dep_runway:
    action: GOA
    sectionId: dep_runway
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  goa_ctr_arr:
    action: GOA
    sectionId: ctr_arr
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  # G/A strip now lives in CTR DEP (common-rules ctr_dep_missed_approach)
  goa_ctr_dep:
    action: GOA
    sectionId: ctr_dep
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  # TopSky ROF (airborne APP/CTR-owned) — keep TopSky; only once inside 20 nm of ESSA
  rof_inbound_arr:
    action: ROF
    sectionId: inbound
    direction: arrival
    airborne: true
    controller: not_myself
    ownerRole: [APP, CTR]
    handoffInitiated: false
    myRole: [TWR]
    withinRangeNm: 20
    withinRangeAirports: [ESSA]
    priority: 120

  # INBOUND ACC: ROF while ACC owns it; ASSUME once handoff initiated
  rof_inbound_acc:
    action: ROF
    sectionId: inbound_acc
    direction: arrival
    airborne: true
    controller: not_myself
    ownerRole: [CTR]
    handoffInitiated: false
    myRole: [APP, CTR]
    priority: 120

  assume_inbound_acc:
    action: ASSUME
    sectionId: inbound_acc
    direction: arrival
    controller: not_myself
    handoffInitiated: true
    myRole: [APP, CTR]
    priority: 100

  # Pure APP (not covering TWR): XFER departures to ACC
  xfer_ctr_dep_app:
    action: XFER
    sectionId: ctr_dep
    direction: departure
    controller: myself
    airborne: true
    handoffInitiated: false
    myRole: [APP]
    priority: 95

  # Ground ROF (TWR↔GND): backend uses custom EFS /EFSROF/ (not TopSky).
  # Override common-rules rof_taxi_dep_twr (sectionId: taxi).
  # Separate GND online → ROF on INBOUND GND-*; alone covering GND → TAXI DEP.
  rof_taxi_dep_twr:
    action: ROF
    sectionId: inbound_gnd
    groundstates: [TAXI]
    airborne: false
    controller: not_myself
    notParallelTwrOwner: true
    withinCtr: true
    handoffInitiated: false
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 40

  rof_taxi_dep_twr_covering_gnd:
    action: ROF
    sectionId: taxi_dep
    groundstates: [TAXI]
    airborne: false
    controller: not_myself
    notParallelTwrOwner: true
    withinCtr: true
    handoffInitiated: false
    myRole: [TWR]
    essaFamilies: [GND]
    priority: 40

deleteRules:
  # Do not show redundant: IFR dep leaves when next position has assumed,
  # even while still inside the sector (no altitude gate).
  delete_dep_high_transferred:
    direction: departure
    controller: not_myself
    airborne: true
    priority: 110

  # TWR with separate GND online (not covering GND, GND family not selected):
  # soft-delete as soon as GND assumes — even if still on the runway
  # (strip stayed on RUNWAY until TXIN or this assume). Solo TWR / combined: no match.
  delete_arr_gnd_assumed_taxi:
    direction: arrival
    airborne: false
    controller: not_myself
    ownerRole: [GND]
    myRole: [TWR]
    notMyRole: [GND]
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    priority: 90

  # Mirror of delete_arr_gnd_assumed_taxi: GND (not covering TWR) hides deps
  # as soon as TWR assumes — leave TAXIWAY DEP (TAXI / LINEUP / DEPA).
  delete_dep_twr_assumed_gnd:
    direction: departure
    airborne: false
    controller: not_myself
    ownerRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    essaFamilies: [GND]
    notEssaFamilies: [TWR]
    priority: 95

  delete_dep_twr_assumed_local_gnd:
    direction: local
    airborne: false
    controller: not_myself
    ownerRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    essaFamilies: [GND]
    notEssaFamilies: [TWR]
    priority: 95

moveRules:
  # TSAT → PUSH: write GS even for TWR top-down (common-rules was GND-only —
  # drag to PUSH left EuroScope ONFREQ while bay showed PUSH).
  move_cleared_to_push:
    fromSectionId: cleared
    toSectionId: push_start
    direction: either
    myRole: [GND, TWR, DEL, APP, CTR]
    command:
      type: setGroundstate
      value: PUSH

  # Override common-rules taxi moves for split sections (taxi_dep)
  # CD ALL / TSAT → TAXI DEP: TXO only — never set CLR
  move_pending_to_taxi:
    fromSectionId: pending_dep
    toSectionId: taxi_dep
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: TAXI

  move_cleared_to_taxi:
    fromSectionId: cleared
    toSectionId: taxi_dep
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: TAXI

  # CD ALL → PUSH: PUSH only (no CLR)
  move_pending_to_push:
    fromSectionId: pending_dep
    toSectionId: push_start
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: PUSH

  move_push_to_taxi:
    fromSectionId: push_start
    toSectionId: taxi_dep
    direction: either
    myRole: [GND]
    command:
      type: setGroundstate
      value: TAXI

  undo_taxi_to_push:
    fromSectionId: taxi_dep
    toSectionId: push_start
    direction: either
    command:
      type: setGroundstate
      value: PUSH

  # TAXI DEP → TSAT: revert TXO (keep CLR)
  undo_taxi_to_cleared:
    fromSectionId: taxi_dep
    toSectionId: cleared
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: ONFREQ

  # TAXI DEP → CD ALL: revert TXO + CLR
  undo_taxi_to_pending:
    fromSectionId: taxi_dep
    toSectionId: pending_dep
    direction: either
    priority: 20
    commands:
      - type: setGroundstate
        value: ONFREQ
      - type: setClearance
        value: false

  # PUSH → CD ALL: revert PUSH + CLR
  undo_push_to_pending:
    fromSectionId: push_start
    toSectionId: pending_dep
    direction: either
    priority: 20
    commands:
      - type: setGroundstate
        value: ONFREQ
      - type: setClearance
        value: false

  # TAXI / TAXI DEP → any RUNWAY pair: LU (LINEUP)
  # toSectionIdContains matches runway_01L_19R etc. and legacy arr/dep_runway
  move_taxi_dep_to_runway:
    fromSectionId: taxi_dep
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setGroundstate
      value: LINEUP

  # INBOUND GND → TAXI DEP: assume / take taxi-out
  move_inbound_gnd_to_taxi_dep:
    fromSectionId: inbound_gnd
    toSectionId: taxi_dep
    direction: either
    myRole: [TWR]
    priority: 20

  # INBOUND GND → RUNWAY: LU
  move_inbound_gnd_to_runway:
    fromSectionId: inbound_gnd
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setGroundstate
      value: LINEUP

  # INBOUND → RUNWAY: CTL
  move_inbound_to_runway:
    fromSectionId: inbound
    toSectionIdContains: runway
    direction: arrival
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  # CTR ARR → RUNWAY: CTL
  move_ctr_arr_to_runway:
    fromSectionId: ctr_arr
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  # RUNWAY → TAXI DEP (departures)
  move_runway_to_taxi_dep:
    fromSectionIdContains: runway
    toSectionId: taxi_dep
    direction: departure
    priority: 10
    command:
      type: setGroundstate
      value: TAXI

  # RUNWAY → TAXI ARR
  move_runway_to_taxi_arr:
    fromSectionIdContains: runway
    toSectionId: taxi_arr
    direction: either
    myRole: [GND, TWR, APP, CTR]
    command:
      type: setGroundstate
      value: TXIN

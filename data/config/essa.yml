# VatEFS ESSA role-based layout.
# Sections appear/hide based on selected ESSA positions (CD, GND-E/N/W, TWR-E/S/W).
# Same dual-runway routing rules as dualrwy4bays.yml; titles follow SAAB EFS naming.
# RUNWAY headers are physical strips (RUNWAY 01L/19R, RUNWAY 01R/19L, RUNWAY 08/26) —
# no ARR/DEP text. One header per strip in use: active ES RWY config, plus any
# strip whose forced/selected ARR/DEP runway is on a physical pair not already
# covered by that config (e.g. DEP 08 while config is 01L). Same-pair traffic
# (01L while config is 01L) does not open another bay.
# ARR-only strips sit in bay1 between CTR ARR and TAXI ARR. Active RWY config owns
# column preference (FPL assignments do not flip it).

name: ESSA
layoutMode: essaRoles
radarRange: 25  # nm

include:
  - common-rules.yml

layout:
  bays:
    # Left → right: arrivals L→R, departure stages R←L (CD/TSAT on the right).
    # Max 4 columns: if CD+GND+TWR would show 5, CD stacks above TSAT in one bay.
    bay1:
      sections:
        inbound_acc:
          # APP / top-down covering approach: unassumed ACC-owned arrivals at ETN ≤ 15.
          # Hidden from TWR-only boards. Sorted by sector-entry minutes.
          title: INBOUND ACC
          visibleFor: [APP]
        inbound:
          # Placeholder title only — runtime always resolves to INBOUND APP (TWR)
          # or INBOUND TWR-E, TWR-W (GND-only). Never shown as bare "INBOUND".
          # Hidden when APP family is also selected (inbound-from-yourself).
          # TWR: ETN≤15 gate + ETN sort. GND: tower-bound rules, appearance order.
          title: INBOUND
          visibleFor: [GND, TWR]
        ctr_arr:
          # Same strip home for CTR ARR (TWR) and TMA ARR (APP / CD+GND+TWR+APP default).
          # filterEssaLayout retitles to TMA ARR when APP family is selected.
          title: CTR ARR
          visibleFor: [TWR, APP]
        arr_runway:
          # Placeholder — replaced at runtime with RUNWAY 01L/19R style pair headers
          title: RUNWAY
          # First L/U into bay stays above later; CFTO ranks above LINEUP in UI
          addFromTop: false
          visibleFor: [TWR]
        taxi_arr:
          title: TAXIWAY ARR
          # TWR-only: still-on-RWY hold; once vacated → TAXI ARR + XFER to GND.
          # With GND selected, TWR uses this for assumed taxi-in as usual.
          visibleFor: [GND, TWR]

    bay2:
      sections:
        ctr_dep:
          # Same strip home for CTR DEP (TWR) and TMA DEP (APP / CD+GND+TWR+APP default).
          # filterEssaLayout retitles to TMA DEP when APP family is selected.
          title: CTR DEP
          addFromTop: false
          visibleFor: [TWR, APP]
        dep_runway:
          # Placeholder — replaced at runtime with RUNWAY 01L/19R style pair headers
          title: RUNWAY
          addFromTop: false
          visibleFor: [TWR]

    bay3:
      sections:
        # TWR-only: other-owned taxi-out (mirror INBOUND APP).
        # Header resolves to INBOUND GND-E, GND-N, GND-W.
        # Hidden when GND is also selected. Assumed / inbound-transfer → TAXI DEP.
        inbound_gnd:
          title: INBOUND GND
          visibleFor: [TWR]
        taxi_dep:
          title: TAXIWAY DEP
          # First in the taxi sequence stays on top. The last one cleared
          # (newest taxi-out) is appended at the bottom.
          addFromTop: false
          visibleFor: [GND, TWR]
        push_start:
          title: PUSH BACK / START-UP
          addFromTop: true
          visibleFor: [GND]
        # Declared for sectionRules / strip assignment. Workspace built-in
        # defaults omit this header — add via catalog when needed.
        req_push:
          title: REQ PUSH / START
          addFromTop: true
          visibleFor: [CD, GND]

    bay4:
      sections:
        cleared:
          # Cleared deps waiting for push/startup (CD and GND).
          # Split → TSAT / EOBT only. TSAT order: earliest at bottom
          # (same as INBOUND APP ETA); auto-fit preferTop:false when size-fit on.
          title: TSAT / EOBT
          addFromTop: true
          visibleFor: [CD, GND]

    bay5:
      sections:
        pending_dep:
          # CD (uncleared) — TOBT order: earliest at bottom (same as TSAT / INBOUND APP).
          # Title becomes "CD ALL" only when merged with TSAT / EOBT.
          title: CD
          addFromTop: true
          visibleFor: [CD]

sectionRules:
  # VCH pending pushback / startup request (annotation 2)
  req_push_start:
    sectionId: req_push
    direction: either
    airborne: false
    vchRequests: [P, S]
    priority: 88

  # Override common-rules taxi → split taxi_dep / taxi_arr
  taxi_dep:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI]
    priority: 30

  taxi_dep_local:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    priority: 30

  # RTO / rejected takeoff → TAXI IN: departure with TXIN goes to TAXIWAY ARR (gate)
  taxi_arr_dep_txin:
    sectionId: taxi_arr
    direction: departure
    airborne: false
    groundstates: [TXIN]
    priority: 92

  # ESSA: CA/VA/CAT/OS → CTR ARR (skips TMA). Outer bay is unassumed-only;
  # approach clearance moves even outside the zone. ESGG keeps CA on INBOUND.
  ctr_arr_approach_clearance_other:
    sectionId: ctr_arr
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    approachClearance: true
    priority: 85

  # Disable common-rules within-CTR / pending-handoff pulls — unassumed stay on
  # INBOUND / INBOUND ACC until assume or approach clearance.
  ctr_arr_within_ctr:
    sectionId: ctr_arr
    myRole: []
    priority: 76

  ctr_arr_within_ctr_no_app:
    sectionId: ctr_arr
    myRole: []
    priority: 101

  ctr_arr_pending_inbound_transfer:
    sectionId: ctr_arr
    myRole: []
    priority: 95

  # INBOUND APP (TWR): ETN ≤ 15 instead of airport ETA (ESGG keeps ETA).
  inbound_arr_groundstate:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    myRole: [TWR, APP, CTR]
    maxSectorEntryMinutes: 15
    priority: 70

  fallback_arrival:
    sectionId: inbound
    direction: arrival
    airborne: true
    myRole: [TWR, APP, CTR]
    maxSectorEntryMinutes: 15
    priority: 5

  # INBOUND ACC: unassumed ACC-owned arrivals at ETN ≤ 15
  inbound_acc_arr:
    sectionId: inbound_acc
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    controller: not_myself
    ownerRole: [CTR]
    maxSectorEntryMinutes: 15
    priority: 72

  # TWR + separate GND: pending inbound handoff → TAXI DEP (like CTR ARR pending transfer)
  taxi_dep_pending_inbound_transfer:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI, TXIN]
    controller: not_myself
    handoffToMyself: true
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 95

  taxi_dep_pending_inbound_transfer_local:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: not_myself
    handoffToMyself: true
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 95

  # TWR: assumed taxi-out → TAXI DEP (not yet on RWY)
  taxi_dep_assumed_twr:
    sectionId: taxi_dep
    direction: departure
    airborne: false
    groundstates: [TAXI]
    controller: myself
    myRole: [TWR]
    priority: 90

  taxi_dep_assumed_local_twr:
    sectionId: taxi_dep
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: myself
    myRole: [TWR]
    priority: 90

  # TWR-only: other-owned taxi-out → INBOUND GND-E/N/W (mirror INBOUND APP)
  inbound_gnd_taxi_dep:
    sectionId: inbound_gnd
    direction: departure
    airborne: false
    groundstates: [TAXI, TXIN]
    controller: not_myself
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 70

  inbound_gnd_taxi_local:
    sectionId: inbound_gnd
    direction: local
    airborne: false
    groundstates: [TAXI]
    controller: not_myself
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 70

  taxi_arr_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    groundstates: [ARR, TXIN]
    priority: 35

  taxi_arr:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    groundstates: ['', NSTS, ARR, TAXI, TXIN]
    priority: 30

  # GND: pending inbound transfer from TWR → hop to TAXI ARR (before assume)
  taxi_arr_pending_inbound_transfer:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    onRunway: false
    controller: not_myself
    handoffToMyself: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  taxi_arr_pending_inbound_transfer_local:
    sectionId: taxi_arr
    direction: local
    airborne: false
    onRunway: false
    controller: not_myself
    handoffToMyself: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  # GND: after assuming a vacated arrival, move INBOUND → TAXI ARR
  # clearedToLand: false — keep CTL traffic on runway even if airborne flickers false on short final
  taxi_arr_assumed_gnd:
    sectionId: taxi_arr
    direction: arrival
    airborne: false
    onRunway: false
    clearedToLand: false
    controller: myself
    myRole: [GND]
    priority: 105

  taxi_arr_assumed_local_gnd:
    sectionId: taxi_arr
    direction: local
    airborne: false
    onRunway: false
    clearedToLand: false
    controller: myself
    myRole: [GND]
    priority: 105

  # GND (not covering TWR): only tower-bound traffic under INBOUND TWR —
  # same moments TWR would see CTR ARR / ARR RWY (APP→TWR transfer, CTR, runway).
  # Far-out APP arrivals stay out of INBOUND TWR until then.
  inbound_pending_twr_transfer_gnd:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    handoffToRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  inbound_pending_twr_transfer_local_gnd:
    sectionId: inbound
    direction: local
    airborne: true
    groundstates: ['', NSTS, ARR]
    handoffToRole: [TWR]
    myRole: [GND]
    notMyRole: [TWR]
    priority: 115

  # Inside CTR → TWR would use ctr_arr_within_ctr; GND keeps it in INBOUND TWR
  inbound_within_ctr_arr_gnd:
    sectionId: inbound
    direction: arrival
    airborne: true
    groundstates: ['', NSTS, ARR]
    withinCtr: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 112

  inbound_within_ctr_local_gnd:
    sectionId: inbound
    direction: local
    airborne: true
    groundstates: ['', NSTS, ARR]
    withinCtr: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 112

  inbound_on_runway_arr_gnd:
    sectionId: inbound
    direction: arrival
    onRunway: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  inbound_on_runway_local_gnd:
    sectionId: inbound
    direction: local
    onRunway: true
    myRole: [GND]
    notMyRole: [TWR]
    priority: 210

  # GND (not covering TWR): keep other-owned vacated arrivals in INBOUND until GND assumes
  inbound_vacated_arr_gnd:
    sectionId: inbound
    direction: arrival
    airborne: false
    onRunway: false
    controller: not_myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 100

  inbound_vacated_local_gnd:
    sectionId: inbound
    direction: local
    airborne: false
    onRunway: false
    controller: not_myself
    myRole: [GND]
    notMyRole: [TWR]
    priority: 100

  # === GEOGRAPHIC RUNWAY DETECTION (highest priority) ===

  on_runway_geographic_dep:
    sectionId: dep_runway
    onRunway: true
    depRunway: true
    priority: 201

  on_runway_geographic_arr:
    sectionId: arr_runway
    onRunway: true
    arrRunway: true
    priority: 200

  on_runway_geographic_third_dep:
    sectionId: dep_runway
    onRunway: true
    depRunway: false
    arrRunway: false
    direction: departure
    priority: 191

  on_runway_geographic_third_arr:
    sectionId: arr_runway
    onRunway: true
    depRunway: false
    arrRunway: false
    direction: arrival
    priority: 190

  # === RUNWAY SECTION RULES ===

  runway_lineup_depa_dep:
    sectionId: dep_runway
    airborne: false
    groundstates: [LINEUP, DEPA]
    depRunway: true
    priority: 91

  runway_lineup_depa_arr:
    sectionId: arr_runway
    airborne: false
    groundstates: [LINEUP, DEPA]
    depRunway: false
    priority: 90

  runway_cleared_to_land_dep:
    sectionId: dep_runway
    direction: either
    clearedToLand: true
    airborne: true
    groundstates: ['', NSTS, ARR]
    depRunway: true
    priority: 96

  runway_cleared_to_land_arr:
    sectionId: arr_runway
    direction: either
    clearedToLand: true
    airborne: true
    groundstates: ['', NSTS, ARR]
    priority: 95

  # === TWR-ONLY + separate GND: hold on RWY while still geographically on runway ===
  # Once vacated → taxi_arr (priority 30) + XFER to GND. Do not hold until GND assumes.

  runway_hold_twr_only_arr:
    sectionId: arr_runway
    direction: arrival
    airborne: false
    onRunway: true
    groundstates: ['', NSTS, ARR, TXIN]
    controller: myself
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    notMyRole: [GND]
    priority: 85

  runway_hold_twr_only_arr_local:
    sectionId: arr_runway
    direction: local
    airborne: false
    onRunway: true
    groundstates: [ARR, TXIN]
    controller: myself
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    notMyRole: [GND]
    priority: 85

  runway_hold_twr_only_dep:
    sectionId: dep_runway
    direction: arrival
    airborne: false
    onRunway: true
    groundstates: ['', NSTS, ARR, TXIN]
    controller: myself
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    notMyRole: [GND]
    priority: 85

  runway_hold_twr_only_dep_local:
    sectionId: dep_runway
    direction: local
    airborne: false
    onRunway: true
    groundstates: [ARR, TXIN]
    controller: myself
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    notMyRole: [GND]
    priority: 85

actionRules:
  # CD ALL: CLNC / ACK CLR for uncleared deps (CD family selected)
  clnc_cd_pending:
    action: CLNC
    sectionId: pending_dep
    direction: either
    clearance: false
    essaFamilies: [CD]
    priority: 120

  # GOA while CTL — runway or CTR ARR. Do not use notMyRole:[GND] (hides GOA for solo TWR).
  goa_arr_runway:
    action: GOA
    sectionId: arr_runway
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  goa_dep_runway:
    action: GOA
    sectionId: dep_runway
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  goa_ctr_arr:
    action: GOA
    sectionId: ctr_arr
    direction: either
    controller: myself
    airborne: true
    clearedToLand: true
    myRole: [TWR, APP, CTR]
    priority: 95

  # TopSky ROF (airborne APP/CTR-owned) — keep TopSky; only once inside 20 nm of ESSA
  rof_inbound_arr:
    action: ROF
    sectionId: inbound
    direction: arrival
    airborne: true
    controller: not_myself
    ownerRole: [APP, CTR]
    handoffInitiated: false
    myRole: [TWR]
    withinRangeNm: 20
    withinRangeAirports: [ESSA]
    priority: 120

  # INBOUND ACC: ROF while ACC owns it; ASSUME once handoff initiated
  rof_inbound_acc:
    action: ROF
    sectionId: inbound_acc
    direction: arrival
    airborne: true
    controller: not_myself
    ownerRole: [CTR]
    handoffInitiated: false
    myRole: [APP, CTR]
    priority: 120

  assume_inbound_acc:
    action: ASSUME
    sectionId: inbound_acc
    direction: arrival
    controller: not_myself
    handoffInitiated: true
    myRole: [APP, CTR]
    priority: 100

  # Pure APP (not covering TWR): XFER departures to ACC
  xfer_ctr_dep_app:
    action: XFER
    sectionId: ctr_dep
    direction: departure
    controller: myself
    airborne: true
    handoffInitiated: false
    myRole: [APP]
    priority: 95

  # Ground ROF (TWR↔GND): backend uses custom EFS /EFSROF/ (not TopSky).
  # Override common-rules rof_taxi_dep_twr (sectionId: taxi).
  # Separate GND online → ROF on INBOUND GND-*; alone covering GND → TAXI DEP.
  rof_taxi_dep_twr:
    action: ROF
    sectionId: inbound_gnd
    groundstates: [TAXI]
    airborne: false
    controller: not_myself
    notParallelTwrOwner: true
    withinCtr: true
    handoffInitiated: false
    myRole: [TWR]
    notEssaFamilies: [GND]
    priority: 40

  rof_taxi_dep_twr_covering_gnd:
    action: ROF
    sectionId: taxi_dep
    groundstates: [TAXI]
    airborne: false
    controller: not_myself
    notParallelTwrOwner: true
    withinCtr: true
    handoffInitiated: false
    myRole: [TWR]
    essaFamilies: [GND]
    priority: 40

deleteRules:
  # Do not show redundant: IFR dep leaves when next position has assumed,
  # even while still inside the sector (no altitude gate).
  delete_dep_high_transferred:
    direction: departure
    controller: not_myself
    airborne: true
    priority: 110

  # TWR with separate GND online (not covering GND, GND family not selected):
  # hide arrival once GND has assumed and taxi-in is set (TXIN / TAXI).
  # Solo TWR covering GND, or combined GND+TWR picker, does not match.
  delete_arr_gnd_assumed_taxi:
    direction: arrival
    groundstates: [TXIN, TAXI]
    airborne: false
    controller: not_myself
    ownerRole: [GND]
    myRole: [TWR]
    notMyRole: [GND]
    essaFamilies: [TWR]
    notEssaFamilies: [GND]
    priority: 90

moveRules:
  # Override common-rules taxi moves for split sections (taxi_dep)
  # CD ALL / TSAT → TAXI DEP: TXO only — never set CLR
  move_pending_to_taxi:
    fromSectionId: pending_dep
    toSectionId: taxi_dep
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: TAXI

  move_cleared_to_taxi:
    fromSectionId: cleared
    toSectionId: taxi_dep
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: TAXI

  # CD ALL → PUSH: PUSH only (no CLR)
  move_pending_to_push:
    fromSectionId: pending_dep
    toSectionId: push_start
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: PUSH

  move_push_to_taxi:
    fromSectionId: push_start
    toSectionId: taxi_dep
    direction: either
    myRole: [GND]
    command:
      type: setGroundstate
      value: TAXI

  undo_taxi_to_push:
    fromSectionId: taxi_dep
    toSectionId: push_start
    direction: either
    command:
      type: setGroundstate
      value: PUSH

  # TAXI DEP → TSAT: revert TXO (keep CLR)
  undo_taxi_to_cleared:
    fromSectionId: taxi_dep
    toSectionId: cleared
    direction: either
    priority: 20
    command:
      type: setGroundstate
      value: ONFREQ

  # TAXI DEP → CD ALL: revert TXO + CLR
  undo_taxi_to_pending:
    fromSectionId: taxi_dep
    toSectionId: pending_dep
    direction: either
    priority: 20
    commands:
      - type: setGroundstate
        value: ONFREQ
      - type: setClearance
        value: false

  # PUSH → CD ALL: revert PUSH + CLR
  undo_push_to_pending:
    fromSectionId: push_start
    toSectionId: pending_dep
    direction: either
    priority: 20
    commands:
      - type: setGroundstate
        value: ONFREQ
      - type: setClearance
        value: false

  # TAXI / TAXI DEP → any RUNWAY pair: LU (LINEUP)
  # toSectionIdContains matches runway_01L_19R etc. and legacy arr/dep_runway
  move_taxi_dep_to_runway:
    fromSectionId: taxi_dep
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setGroundstate
      value: LINEUP

  # INBOUND GND → TAXI DEP: assume / take taxi-out
  move_inbound_gnd_to_taxi_dep:
    fromSectionId: inbound_gnd
    toSectionId: taxi_dep
    direction: either
    myRole: [TWR]
    priority: 20

  # INBOUND GND → RUNWAY: LU
  move_inbound_gnd_to_runway:
    fromSectionId: inbound_gnd
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setGroundstate
      value: LINEUP

  # INBOUND → RUNWAY: CTL
  move_inbound_to_runway:
    fromSectionId: inbound
    toSectionIdContains: runway
    direction: arrival
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  # CTR ARR → RUNWAY: CTL
  move_ctr_arr_to_runway:
    fromSectionId: ctr_arr
    toSectionIdContains: runway
    direction: either
    myRole: [TWR, APP, CTR]
    command:
      type: setClearedToLand
      value: true

  # RUNWAY → TAXI DEP (departures)
  move_runway_to_taxi_dep:
    fromSectionIdContains: runway
    toSectionId: taxi_dep
    direction: departure
    priority: 10
    command:
      type: setGroundstate
      value: TAXI

  # RUNWAY → TAXI ARR
  move_runway_to_taxi_arr:
    fromSectionIdContains: runway
    toSectionId: taxi_arr
    direction: either
    myRole: [GND, TWR, APP, CTR]
    command:
      type: setGroundstate
      value: TXIN
